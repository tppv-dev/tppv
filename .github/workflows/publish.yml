name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing (OIDC) — no npm token.
# Configure each package on npmjs.com → Settings → Trusted Publisher:
#   Organization: tppv-dev
#   Repository:   tppv
#   Workflow:     publish.yml
#   Allow action: npm publish  (not only npm stage publish)
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish @tppv-dev/cli
        run: npm publish -w @tppv-dev/cli --access public
      - name: Publish @tppv-dev/mcp
        run: npm publish -w @tppv-dev/mcp --access public
