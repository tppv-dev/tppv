name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing + staged publish only.
# On npmjs.com leave "npm publish" UNCHECKED (stage only).
# After CI: npmjs.com → Staged Packages → Approve (2FA).
#
# Trusted Publisher fields:
#   Organization: tppv-dev
#   Repository:   tppv
#   Workflow:     publish.yml
#   Environment:  (empty)
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Stage @tppv-dev/cli
        working-directory: packages/cli
        run: npm stage publish --access public
      - name: Stage @tppv-dev/mcp
        working-directory: packages/mcp
        run: npm stage publish --access public
